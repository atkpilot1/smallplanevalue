# Production overlay (ogfaqdmhqwlysavooroo).
# Declared only — do not apply until `npm run db:config:push:prod`.
# Other Auth keys below are still the captured hosted defaults.

[auth]
site_url = "https://www.smallplanevalue.com"
additional_redirect_urls = [
  "https://www.smallplanevalue.com",
  "https://www.smallplanevalue.com/**",
  "https://smallplanevalue.com",
  "https://smallplanevalue.com/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.template.magic_link]
subject = "Your Magic Link"
content_path = "./supabase/templates/magic_link.prod.html"
