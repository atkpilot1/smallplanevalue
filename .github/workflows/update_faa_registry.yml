name: Update FAA Aircraft Registry

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: Which project name in SUPABASE_PROJECTS to update
        type: choice
        default: both
        options:
          - both
          - staging
          - production

jobs:
  update-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download FAA registry and import
        env:
          FAA_SYNC_TARGET: ${{ github.event.inputs.target || 'both' }}
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
          FAA_ZIP_URL: ${{ secrets.FAA_ZIP_URL }}
        run: python .github/scripts/update_faa_registry.py
